name: Monthly wallpaper rotation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # -----------------------------
      # 2. Setup Node
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------
      # 3. Install dependencies (IMPORTANT)
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # 4. Run rotation script
      # -----------------------------
      - name: Run rotation script
        run: node scripts/rotate.js

      # -----------------------------
      # 5. Commit & push
      # -----------------------------
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add active.json

          git commit -m "Monthly wallpaper rotation" || echo "No changes to commit"

          git push origin HEAD:main
