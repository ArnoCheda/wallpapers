name: Monthly wallpaper rotation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # 2. Node setup
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------
      # 3. Install deps
      # -----------------------------
      - name: Install dependencies
        run: npm install

      # -----------------------------
      # 4. Run script
      # -----------------------------
      - name: Run rotation script
        run: node scripts/rotate.js

      # -----------------------------
      # 5. Commit changes
      # -----------------------------
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add active.json state.json
      
          git commit -m "Wallpaper rotation" || echo "No changes"
      
          git push origin HEAD:main
